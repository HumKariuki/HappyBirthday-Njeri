<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Ann 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- INTRO SCREEN -->
    <div id="introScreen">
        <h1>For Ann 💖</h1>
        <button id="enterBtn">Enter</button>
    </div>

    <!-- MUSIC -->
    <audio id="bgMusic" loop preload="metadata">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <canvas id="heartsCanvas"></canvas>
    <canvas id="confettiCanvas"></canvas>

    <button id="darkToggle">🌙</button>

    <div class="app-container hidden">
        <section class="hero">
            <h1>Happy Birthday Ann 🎂</h1>
            <p id="typewriter"></p>
            <h3>✨ The Best Colleague & A Beautiful Soul ✨</h3>
        </section>

        <!-- PHOTO SLIDER -->
        <section class="slider">
            <div class="slides" id="sliderContainer">
                <img src="IMG_20251116_080454_672.jpg" class="slide active" alt="Ann 1" loading="lazy">
                <img src="IMG_20251116_060838_751.jpg" class="slide" alt="Ann 2" loading="lazy">
                <img src="IMG-20251113-WA0001.jpg" class="slide" alt="Ann 3" loading="lazy">
                <img src="IMG_20251126_203951_702.jpg" class="slide" alt="Ann 4" loading="lazy">
                <img src="IMG_20251207_211756_696.jpg" class="slide" alt="Ann 5" loading="lazy">
                <img src="IMG_20251221_083850_887.jpg" class="slide" alt="Ann 6" loading="lazy">
                <img src="IMG_20251229_072508_367.jpg" class="slide" alt="Ann 7" loading="lazy">
                <img src="IMG_20260111_141537_322.jpg" class="slide" alt="Ann 8" loading="lazy">
            </div>
            <div class="slider-indicator">
                <span id="currentSlide">1</span>/<span id="totalSlides">8</span>
            </div>
            <div class="controls">
                <button id="prev" aria-label="Previous slide">⟨</button>
                <button id="next" aria-label="Next slide">⟩</button>
            </div>
        </section>

        <!-- MESSAGE BOX -->
        <section class="message-box">
            <p id="dynamicMessage">You make work brighter and life softer 💖</p>
            <button id="newMessage">💌 New Message</button>
        </section>

        <!-- INTERACTIONS -->
        <section class="interactive">
            <div class="love-counter" role="button" tabindex="0" aria-label="Love counter">
                ❤️ <span id="loveCount">0</span>
            </div>
            <button id="confettiBtn">Celebrate 🎉</button>
            <button id="secretBtn">Secret 💝</button>
        </section>

        <footer class="main-footer">
            Made specially for you Ann 💖
        </footer>
    </div>

    <footer class="credit-footer">
        <p>Designed with love by <strong>HumTech Solutions ❤️</strong></p>
        <p>📞 +254 721 112 164</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
