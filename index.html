<body>

<!-- INTRO SCREEN -->
<div id="introScreen">
    <h1>For Ann 💖</h1>
    <button id="enterBtn">Enter</button>
</div>

<!-- MUSIC -->
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<canvas id="heartsCanvas"></canvas>
<canvas id="confettiCanvas"></canvas>

<button id="darkToggle">🌙</button>

<div class="app-container hidden">

    <section class="hero">
        <h1>Happy Birthday Ann 🎂</h1>
        <p id="typewriter"></p>
        <h3>✨ The Best Colleague & A Beautiful Soul ✨</h3>
    </section>

    <!-- PHOTO SLIDER -->
    <section class="slider">
        <div class="slides">
            <img src="IMG_20251116_080454_672.jpg" class="slide active">
            <img src="IMG_20251116_060838_751.jpg" class="slide">
            <img src="IMG-20251113-WA0001.jpg" class="slide">
            <img src="IMG_20251126_203951_702.jpg" class="slide">

            <img src="IMG_20251229_072508_367.jpg" class="slide">
            <img src="IMG_20260111_141537_322.jpg" class="slide">
        </div>
        </div>
        </div>
        </div>
        <div class="controls">
            <button id="prev">⟨</button>
            <button id="next">⟩</button>
        </div>
    </section>

    <!-- MESSAGE BOX -->
    <section class="message-box">
        <p id="dynamicMessage">
            You make work brighter and life softer 💖
        </p>
        <button id="newMessage">💌 New Message</button>
    </section>

    <!-- INTERACTIONS -->
    <section class="interactive">
        <div class="love-counter">
            ❤️ <span id="loveCount">0</span>
        </div>
        <button id="confettiBtn">Celebrate 🎉</button>
        <button id="secretBtn">Secret</button>
    </section>

    <footer>
        Made specially for you Ann 💖
    </footer>
